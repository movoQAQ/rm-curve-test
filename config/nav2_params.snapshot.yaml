local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: base_link_fake
      #robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.15 #0.15
      plugins: ["static_layer",  "obstacle_layer", "inflation_layer"]
      #plugins: ["static_layer", "intensity_voxel_layer", "obstacle_layer", "inflation_layer"]
      # plugins: ["static_layer", "obstacle_layer"]

      #plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      #plugins: ["ground_consistency_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        min_obstacle_intensity: -1000.0
        max_obstacle_intensity: 1000.0
        observation_sources: terrain_map
        terrain_map:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /terrain_map
          sensor_frame: aft_mapped
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.35 #0.5

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: livox 
        max_obstacle_height: 1.0
        min_obstacle_height: -1.0
        livox:
          topic: /scan
          max_obstacle_height: 1.0
          min_obstacle_height: -1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0       #?
          raytrace_min_range: 0.2
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

      ground_consistency_layer:
        plugin: "nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer"
        # Input topics
        ground_points_topic: "/ground"
        nonground_points_topic: "/nonground"
        tf_timeout: 0.1
        
        # Robot dimensions
        robot_height: 1.75
        min_clearance: 0.1
        maximum_height_filter: 5.0
        
        # Evidence accumulation
        ground_inc: 1.0
        nonground_inc: 1.5
        
        # Decay rates (per update cycle)
        ground_decay: 0.80
        nonground_decay: 0.65
        
        # Thresholds
        nonground_occ_thresh: 2.0
        nonground_prob_thresh: 0.750
        max_score: 50.0
        
        # Performance & memory
        max_data_range: 50.0
        discretize_costs: false
        footprint_clearing_enabled: true
        
        # Gap interpolation
        ground_neighbor_search_cells: 0
        
        # Logging
        enable_kpi_logging: false
      

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: base_link_fake
      #robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.15
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer",  "obstacle_layer", "inflation_layer"]
      #plugins: ["static_layer", "intensity_voxel_layer", "obstacle_layer", "inflation_layer"]
      # plugins: ["static_layer","inflation_layer"]
      # plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.1
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map_ext
        terrain_map_ext:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /terrain_map_ext
          sensor_frame: odom
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: livox 
        max_obstacle_height: 100.0
        min_obstacle_height: -100.0
        livox:
          topic: /scan
          max_obstacle_height: 100.0
          min_obstacle_height: -100.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # 系数越小,从机器人半径减小的斜率越小,外围代价越大
        inflation_radius: 0.45  #0.55
      always_send_full_costmap: True


